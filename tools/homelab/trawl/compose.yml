# TRAWL on a Raspberry Pi 5 (arm64 image is published upstream: ghcr.io/germondai/trawl).
# Drop-in FlareSolverr replacement for Prowlarr / Jackett. Install: see README.md next to this file.
services:
  trawl-redis:
    image: redis:8.10.2-alpine
    container_name: trawl-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "300", "10"]
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  trawl:
    image: ghcr.io/germondai/trawl:latest
    container_name: trawl
    restart: unless-stopped
    ports:
      - "8191:8191"            # FlareSolverr-compatible API (/v1) + native /scrape + /health
    # Camoufox (Firefox) needs shared memory; 512 MB is plenty for a single browser.
    shm_size: 512mb
    mem_limit: 1536m
    env_file: .env
    environment:
      SESSION_CACHE_DRIVER: redis
      REDIS_URL: redis://trawl-redis:6379
    volumes:
      - ./metrics:/data/metrics
    depends_on:
      trawl-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s       # the Pi takes longer than a PC to warm the browser pool
